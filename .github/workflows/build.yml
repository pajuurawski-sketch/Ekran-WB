name: Buduj Ekran W&B APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      - name: Ustaw Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Znajdź ZIP projektu
        id: zip
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Nie znaleziono pliku ZIP projektu Android."
            exit 1
          fi

          echo "Znaleziono ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Rozpakuj projekt Android
        run: |
          mkdir -p android_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d android_project

      - name: Znajdź folder projektu Gradle
        id: project
        run: |
          PROJECT_DIR=$(find android_project \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Nie znaleziono settings.gradle ani settings.gradle.kts."
            echo "Zawartość ZIP:"
            find android_project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Projekt Gradle: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Zbuduj APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug

      - name: Sprawdź i przygotuj APK
        run: |
          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "BŁĄD: Nie znaleziono wygenerowanego APK."
            exit 1
          fi

          mkdir -p dist
          cp "$APK_FILE" dist/Ekran-WB.apk

          echo "APK zostało przygotowane:"
          ls -lh dist/Ekran-WB.apk

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Ekran-WB-APK
          path: dist/Ekran-WB.apk
          if-no-files-found: error
          retention-days: 30
