name: Buduj Ekran W&B APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw środowisko Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Znajdź ZIP projektu
        id: zip
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Nie znaleziono ZIP projektu Android."
            exit 1
          fi

          echo "Znaleziono: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Rozpakuj projekt
        run: |
          mkdir -p android_project
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d android_project

      - name: Znajdź projekt Gradle
        id: project
        run: |
          SETTINGS_FILE=$(find android_project -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Nie znaleziono pliku settings.gradle."
            find android_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projekt: $PROJECT_DIR"

      - name: Zbuduj APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug

      - name: Znajdź APK
        run: |
          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "Nie znaleziono APK."
            exit 1
          fi

          mkdir -p dist
          cp "$APK_FILE" dist/Ekran-WB.apk

          ls -lh dist/Ekran-WB.apk

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Ekran-WB-APK
          path: dist/Ekran-WB.apk
          if-no-files-found: error
          retention-days: 30
