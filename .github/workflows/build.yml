
name: Buduj Ekran W&B APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Znajdź i rozpakuj projekt
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "BLAD: Nie znaleziono archiwum ZIP"
            exit 1
          fi

          echo "Znaleziono ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/ekranwb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/ekranwb"

          PROJECT_DIR=$(find "$RUNNER_TEMP/ekranwb" \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "BLAD: Nie znaleziono settings.gradle ani settings.gradle.kts"
            echo "Zawartość ZIP:"
            find "$RUNNER_TEMP/ekranwb" -maxdepth 4 -type f
            exit 1
          fi

          echo "Projekt znaleziony: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Buduj aplikację APK
        shell: bash
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Sprawdź APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "BLAD: Plik APK nie został utworzony"
            echo "Szukam utworzonych APK:"
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/Ekran-WB.apk

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Ekran-WB-APK
          path: dist/Ekran-WB.apk
          if-no-files-found: error
