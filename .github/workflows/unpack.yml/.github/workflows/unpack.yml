
name: Rozpakuj projekt Ekran W&B

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Nie znaleziono pliku ZIP"
            exit 1
          fi

          mkdir -p /tmp/ekranwb
          unzip -q "$ZIP_FILE" -d /tmp/ekranwb

          ROOT_DIR=$(find /tmp/ekranwb -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$ROOT_DIR" ]; then
            echo "Nie znaleziono folderu projektu"
            exit 1
          fi

          cp -a "$ROOT_DIR/." .
          rm "$ZIP_FILE"

      - name: Zapisz pliki w GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Dodanie projektu Ekran W&B"
            git push
          fi
