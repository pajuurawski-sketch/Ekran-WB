
name: Rozpakuj projekt Ekran W&B

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Znajdź ZIP projektu
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Nie znaleziono pliku ZIP projektu!"
            exit 1
          fi

          echo "Znaleziono ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Rozpakuj projekt
        run: |
          mkdir -p /tmp/ekran_unpack
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d /tmp/ekran_unpack

      - name: Znajdź właściwy folder projektu Android
        id: project
        run: |
          PROJECT_DIR=$(find /tmp/ekran_unpack \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Nie znaleziono projektu Android!"
            echo "ZIP nie zawiera settings.gradle ani settings.gradle.kts"
            exit 1
          fi

          echo "Projekt znaleziony: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Skopiuj projekt do repozytorium
        run: |
          rsync -a \
            --exclude=".git" \
            "${{ steps.project.outputs.project_dir }}/" \
            "./"

      - name: Usuń ZIP projektu
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nie ma zmian do zapisania."
          else
            git commit -m "Rozpakuj projekt Ekran W&B"
            git push
          fi
